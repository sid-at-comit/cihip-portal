databases:
  - name: cihip-postgres
    databaseName: cihip
    user: cihip_user
    plan: free

services:
  - type: web
    name: cihip-national-exchange
    runtime: python
    buildCommand: "test -f requirements.txt && pip install -r requirements.txt || true"
    startCommand: "python server.py"
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: CIHIP_HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: cihip-postgres
          property: connectionString
