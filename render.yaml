services:
  - type: web
    name: cihip-national-exchange
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python server.py"
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: CIHIP_HOST
        value: 0.0.0.0
